name: CI

on:
  push:
    branches: [main, web-ui, modernizacion-integral]
  pull_request:
    branches: [main, web-ui, modernizacion-integral]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      # Subconjunto deliberado: E9 (errores de sintaxis), F63/F7/F82
      # (nombres indefinidos, etc.). El estilo legacy del repo no se toca.
      - name: Ruff
        run: ruff check --select E9,F63,F7,F82 .

      # Solo errores (no warnings de estilo) para no bloquear por deuda antigua.
      - name: ShellCheck
        run: shellcheck -S error xrepost.sh iniciar.sh web/run.sh ci.sh sync_portable.sh xrepost-chrome.sh

      - name: Sintaxis JavaScript
        run: node --check web/static/app.js

      - name: Bandit (seguridad, medium+)
        run: bandit -q -r . -x ./xrepost-portable,./tests,./web/test_app.py,./web/test_engine_selected.py -ll

      - name: pip-audit (dependencias de ejecución)
        run: pip-audit -r requirements.txt --no-deps --disable-pip

      - name: Gitleaks (árbol de trabajo)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-git --redact --verbose

      # Informativo: el código histórico aún no está tipado por completo.
      # Los errores se publican pero no bloquean la integración.
      - name: Mypy (informativo)
        continue-on-error: true
        run: |
          mypy --ignore-missing-imports --no-error-summary \
            xrepost_fs.py xrepost_store.py xrepost_filters.py xrepost_cdp.py \
            xrepost_security.py xrepost_jobs.py xrepost_exports.py xrepost_groups.py \
            xrepost_inbox.py xrepost_schedule.py xrepost_stats.py xrepost_state.py

      - name: Cobertura de los módulos nuevos (mínimo 90 %)
        run: |
          set +e
          python -m coverage run --branch -m pytest -q
          test_rc=$?
          if [ "$test_rc" -ne 0 ]; then
            echo "::error title=Pruebas::pytest terminó con código $test_rc"
            exit "$test_rc"
          fi
          report=$(python -m coverage report --include='xrepost_fs.py,xrepost_store.py,xrepost_filters.py,xrepost_cdp.py,xrepost_security.py,xrepost_jobs.py,xrepost_exports.py,xrepost_groups.py,xrepost_inbox.py,xrepost_schedule.py,xrepost_stats.py,xrepost_history.py,xrepost_selectors.py,xrepost_state.py' --fail-under=90 2>&1)
          rc=$?
          if [ "$rc" -ne 0 ]; then
            # Sin acceso a los logs desde fuera de GitHub, publica el informe
            # como anotaciones para que el fallo sea diagnosticable.
            printf '%s\n' "$report" | while IFS= read -r line; do
              echo "::error title=Cobertura::$line"
            done
            echo "::error title=Entorno::$(python -V 2>&1) / $(coverage --version | head -1)"
            exit "$rc"
          fi
          printf '%s\n' "$report"

      - name: SBOM CycloneDX
        run: |
          cyclonedx-py requirements requirements-dev.txt -o sbom.json
          python -c "import json; json.load(open('sbom.json'))"

      - name: Suite y guardas (pytest, sintaxis, portable, imports)
        run: bash ./ci.sh

      - name: Paquete de distribución
        run: |
          mkdir -p dist
          tar --exclude-vcs --exclude='xrepost-portable' --exclude='dist' \
            --exclude='__pycache__' --exclude='.pytest_cache' \
            -czf dist/xrepost-2.0.0.tar.gz \
            README.md LICENSE_PENDING.md SECURITY.md CHANGELOG.md CONTRIBUTING.md \
            docs xrepost*.py web/static web/app.py web/run.sh xrepost.sh iniciar.sh \
            xrepost-chrome.sh sync_portable.sh ci.sh requirements*.txt pytest.ini ruff.toml \
            tests proxy_auto.pac proxy_empresa.pac
          sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: xrepost-sbom-y-paquete
          path: |
            sbom.json
            dist/*
          retention-days: 14
