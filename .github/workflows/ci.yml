name: CI

on:
  push:
    branches: [main, web-ui, modernizacion-integral]
  pull_request:
    branches: [main, web-ui, modernizacion-integral]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff coverage
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      # Subconjunto deliberado: E9 (errores de sintaxis), F63/F7/F82
      # (nombres indefinidos, etc.). El estilo legacy del repo no se toca.
      - name: Ruff
        run: ruff check --select E9,F63,F7,F82 .

      # Solo errores (no warnings de estilo) para no bloquear por deuda antigua.
      - name: ShellCheck
        run: shellcheck -S error xrepost.sh iniciar.sh web/run.sh ci.sh sync_portable.sh xrepost-chrome.sh

      - name: Sintaxis JavaScript
        run: node --check web/static/app.js

      - name: Cobertura de los módulos nuevos (informativa)
        run: |
          python -m coverage run --branch -m pytest -q
          python -m coverage report --include='xrepost_fs.py,xrepost_store.py,xrepost_filters.py,xrepost_cdp.py,xrepost_security.py,xrepost_jobs.py,xrepost_exports.py,xrepost_groups.py,xrepost_inbox.py,xrepost_schedule.py,xrepost_stats.py,xrepost_history.py'

      - name: Suite y guardas (pytest, sintaxis, portable, imports)
        run: bash ./ci.sh
